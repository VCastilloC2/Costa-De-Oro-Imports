# ==========================================================
# E-COMMERCE BEER - CONFIGURACIÓN DEL SERVIDOR
# ==========================================================
# Nombre de la aplicación (puede ser sobrescrito por variable de entorno)
spring.application.name=${NombreAplicacion:E-commerce_Beer}

# Puerto donde se ejecuta la app
server.port=${PuertoServidor:8080}

# Cargar .env automáticamente
spring.config.import=optional:file:.env[.properties]

# Perfil activo: "local" (por defecto) o "cloud" -> SPRING_PROFILES_ACTIVE=cloud
# Ver application-local.properties / application-cloud.properties
spring.profiles.default=local

# ==========================================================
# CONFIGURACIÓN DE ARCHIVOS (IMÁGENES)
# ==========================================================
# Propiedades para el tamanno de las imagenes
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# ==========================================================
# CONFIGURACIÓN REMEMBER ME
# ==========================================================
# REMEMBER ME CONFIGURATION
security.rememberme.key=${REMEMBER_ME_KEY}
security.rememberme.token-validity=${REMEMBER_ME_TOKEN}

# ==========================================================
# CONFIGURACIÓN JPA / HIBERNATE
# ==========================================================
# Estrategia de creación/actualización de tablas
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# No mostrar consultas SQL en consola
spring.jpa.show-sql=false

# Formatear SQL (opcional)
spring.jpa.properties.hibernate.format_sql=true

# ==========================================================
# INICIALIZACIÓN DE BASE DE DATOS
# ==========================================================
# Activar o desactivar carga automática de datos
#spring.sql.init.mode=always
spring.sql.init.mode=never

# Script de creación de estructura
spring.sql.init.schema-locations=classpath:sql/schema.sql

# Scripts de carga de datos (productos, usuarios, compras, etc.)
spring.sql.init.data-locations=classpath:sql/data.sql, classpath:sql/empresa.sql, classpath:sql/usuario.sql, classpath:sql/producto.sql, classpath:sql/blog.sql, classpath:sql/comentario.sql, classpath:sql/compra-2020.sql, classpath:sql/compra-2021.sql, classpath:sql/compra-2022.sql, classpath:sql/compra-2023.sql, classpath:sql/compra-2024.sql, classpath:sql/compra-2025.sql, classpath:sql/compra-2026.sql, classpath:sql/factura-proveedor.sql, classpath:sql/peticiones.sql

# ==========================================================
# CONFIGURACIÓN DE BASE DE DATOS
# ==========================================================
# URL de conexión a la base de datos SQL - MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# URL de conexión a la base de datos NoSQL - Valkey
# Local:  VALKEY_URL=redis://localhost:6379
# Cloud:  VALKEY_URL=rediss://default:<password>@<host>:6379   <- "rediss" (doble s) = TLS obligatorio
app.redis.enabled=${REDIS_ENABLED:true}
spring.data.redis.url=${VALKEY_URL:redis://localhost:6379}
# Fuerza TLS aunque la URL venga con "redis://" (el Valkey de Layerbase solo acepta TLS)
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
# 500ms era insuficiente para TCP + TLS + AUTH contra un host remoto
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:5s}
spring.data.redis.timeout=${REDIS_TIMEOUT:5000s}
# Habilitar reconexión automática y validación de conexiones inactivas
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:true}
# Pool de conexiones Lettuce (requiere commons-pool2, incluido en el pom)
spring.data.redis.lettuce.pool.enabled=${REDIS_POOL_ENABLED:true}
spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:8}
spring.data.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.data.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:0}
spring.data.redis.lettuce.pool.max-wait=${REDIS_POOL_MAX_WAIT:3s}

# ==========================================================
# CACHE
# ==========================================================
# Habilita Redis como proveedor de caché
spring.cache.type=simple
spring.devtools.restart.enabled=false

# ==========================================================
# CONFIGURACIÓN HIKARI (POOL DE CONEXIONES)
# ==========================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000

# ==========================================================
# CONFIGURACIÓN DE INTELIGENCIA ARTIFICIAL (GEMINI)
# ==========================================================
spring.ai.model.chat=google-genai

# API Key de Google AI Studio
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# Modelo
spring.ai.google.genai.chat.options.model=gemini-3.8-flash

# Temperatura baja para respuestas técnicas
spring.ai.google.genai.chat.options.temperature=0.1

# ==========================================================
# LOGGING
# ==========================================================
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.ai.mcp=DEBUG

# ==========================================================
# SPRING DOC - SWAGGER
# ==========================================================
# Habilitar OpenAPI (deshabilitado por defecto; activar solo en dev/perfil seguro)
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}

# Habilitar Swagger UI (deshabilitado por defecto; activar solo en dev/perfil seguro)
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}

# Rutas de acceso
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Ordenar endpoints
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Mostrar duración de las peticiones
springdoc.swagger-ui.display-request-duration=true

# Expandir operaciones
springdoc.swagger-ui.doc-expansion=none

# ==========================================================
# MCP - Spring AI
# ==========================================================
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.toolcallback.enabled=true

# ==========================================================
# CONFIGURACIÓN JWT (AUTENTICACIÓN)
# ==========================================================
security.jwt.key.private=${JWT_SECRET_ECOMMERCE:LLAVE_TEMP_DEV}
security.jwt.user.generator=${JWT_ISSUER_ECOMMERCE:USER_TEMP_DEV}

# ==========================================================
# SERVICIO FASTAPI (predicciones / minería de datos)
# ==========================================================
# Se aceptan los nombres antiguos PREDICCION_API_URL / PREDICCION_API_KEY como respaldo.
# Los valores por defecto de entorno (localhost vs https) están en application-{local,cloud}.properties.
fastapi.base-url=${FASTAPI_BASE_URL:${PREDICCION_API_URL:${fastapi.default-base-url}}}
fastapi.api-key=${FASTAPI_API_KEY:${PREDICCION_API_KEY:}}
fastapi.connect-timeout=${FASTAPI_CONNECT_TIMEOUT:3s}
fastapi.read-timeout=${FASTAPI_READ_TIMEOUT:15s}
# Predicciones: FastAPI entrena el modelo en la primera llamada (luego responde desde caché)
fastapi.prediction-read-timeout=${FASTAPI_PREDICTION_READ_TIMEOUT:120s}
fastapi.retry.max-retries=${FASTAPI_RETRY_MAX_RETRIES:2}
fastapi.retry.delay=${FASTAPI_RETRY_DELAY:300ms}
fastapi.retry.multiplier=${FASTAPI_RETRY_MULTIPLIER:2.0}
fastapi.retry.max-delay=${FASTAPI_RETRY_MAX_DELAY:3s}
# Vistas de administración servidas por FastAPI (/admin/*). false = lógica local de Spring (rollback rápido).
# La API key necesita los permisos admin:read y admin:write además de los de predicciones.
fastapi.admin.enabled=${FASTAPI_ADMIN_ENABLED:true}

# ==========================================================
# GOOGLE reCAPTCHA
# ==========================================================
spring.google.recaptcha.url=${PASSWORD_URL_RECAPTCHA:https://www.google.com/recaptcha/api/siteverify}
spring.google.recaptcha.secret-key=${PASSWORD_KEY_RECAPTCHA}

# ==========================================================
# OAUTH2 LOGIN CON GOOGLE
# ==========================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope[0]=openid
spring.security.oauth2.client.registration.google.scope[1]=profile
spring.security.oauth2.client.registration.google.scope[2]=email
spring.security.oauth2.client.provider.google.user-name-attribute=email

# ==========================================================
# CONFIGURACIÓN DE CORREO (SMTP - GMAIL)
# ==========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.default-encoding=UTF-8
spring.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.debug=false

# ==========================================================
# CLOUDINARY (GESTIÓN DE IMÁGENES)
# ==========================================================
cloudinary.cloud-name=${CLOUD_NAME}
cloudinary.api_key=${CLOUD_API_KEY}
cloudinary.api_secret=${CLOUD_API_SECRET}

# ==========================================================
# MERCADO PAGO (PAGOS)
# ==========================================================
mercado_pago.access_token=${MERCADO_PAGO_ACCESS_TOKEN:ACCESS_TOKEN}

# ==========================================================
# MANEJO DE ERRORES PERSONALIZADOS
# ==========================================================
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
spring.web.error.whitelabel.enabled=false
spring.web.error.path=/error
spring.web.error.include-message=never
spring.mvc.hiddenmethod.filter.enabled=false