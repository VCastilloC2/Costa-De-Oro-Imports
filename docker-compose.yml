services:

  mysql:
    image: mysql:latest
    container_name: mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: costa_de_oro
      MYSQL_USER: spring
      MYSQL_PASSWORD: spring

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:latest
    container_name: redis

    restart: unless-stopped

    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "yes"
      ]

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:latest

    container_name: ollama

    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  db-hub:
    build:
      context: ./docker/dbhub

    container_name: dbhub

    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "9080:9080"

  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: costa-de-oro-imports:latest

    container_name: costa-app

    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/costa_de_oro?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: spring
      SPRING_DATASOURCE_PASSWORD: spring
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      OPENAI_BASE_URL: http://ollama:11434
      OPENAI_MODEL: qwen3.5:4b

volumes:
  mysql_data:
  redis_data:
  ollama_data:

networks:
  costa-de-oro-network:
    driver: bridge