services:

  mysql:
    image: mysql:latest
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: costa_de_oro
      MYSQL_USER: root
      MYSQL_PASSWORD: 0220

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - costa-de-oro-network

  valkey:
    image: valkey:latest
    container_name: valkey
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "yes"
      ]

    ports:
      - "6379:6379"

    volumes:
      - valkey_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - costa-de-oro-network

  dbhub:
    image: bytebase/dbhub:latest
    container_name: dbhub
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "9080:9080"

    command: [ "--transport", "http", "--port", "9080" ]

    networks:
      - costa-de-oro-network

  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: costa-de-oro-imports:latest

    container_name: costa-app

    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy
      valkey:
        condition: service_healthy
      dbhub:
        condition: service_started

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/costa_de_oro?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: spring
      SPRING_DATASOURCE_PASSWORD: spring
      # spring.data.redis.url tiene prioridad sobre host/port, por eso se define VALKEY_URL
      VALKEY_URL: redis://valkey:6379
      REDIS_SSL_ENABLED: "false"
      # MCP DBHub
      DBHUB_URL: http://dbhub:9080

    networks:
      - costa-de-oro-network

volumes:
  mysql_data:
  valkey_data:

networks:
  costa-de-oro-network:
    driver: bridge