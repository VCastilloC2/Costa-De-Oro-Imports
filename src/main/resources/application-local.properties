# ==========================================================
# PERFIL LOCAL (por defecto: spring.profiles.default=local)
# ==========================================================
# FastAPI corriendo en tu máquina: uvicorn app.main:app --port 8000
fastapi.default-base-url=http://localhost:8000
fastapi.require-https=false

# Logs detallados de cada llamada a FastAPI (método, ruta, estado, latencia)
logging.level.com.application.configuration.fastapi=DEBUG
