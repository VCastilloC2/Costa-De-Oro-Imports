# ==========================================================
# PERFIL CLOUD / PRODUCCIÓN  (SPRING_PROFILES_ACTIVE=cloud)
# ==========================================================
# Sin URL por defecto: FASTAPI_BASE_URL y FASTAPI_API_KEY son obligatorias.
# Si faltan, la aplicación no arranca (fail-fast) en vez de apuntar a localhost.
fastapi.default-base-url=
# La API key viaja en una cabecera: en la nube solo se permite https.
fastapi.require-https=true

logging.level.com.application.configuration.fastapi=INFO

# Valkey gestionado (Layerbase) solo acepta conexiones TLS
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}

# ==========================================================
# RENDER / PRODUCCIÓN
# ==========================================================
# Render termina TLS en su proxy: respetar X-Forwarded-Proto/Host para que
# OAuth2 (redirect_uri), cookies "secure" y redirecciones usen https://<app>.onrender.com
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Health check de Render -> /actuator/health/readiness
# (readiness no depende de SMTP/Redis: un fallo externo no reinicia el contenedor)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Swagger apagado en producción (se puede reactivar por variable de entorno)
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}

# Pool más pequeño: planes de Render y MySQL gestionados tienen pocas conexiones
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# Nunca crear/alterar tablas en producción por defecto
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

# Logs menos verbosos
logging.level.org.springframework.ai=INFO
logging.level.org.springframework.ai.mcp=INFO

# Disco del contenedor: solo /tmp es escribible (y se borra en cada deploy; las imágenes persistentes van a Cloudinary)
app.upload-dir=${UPLOAD_DIR:/tmp/gestion-ventas/}
